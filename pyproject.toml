[project]
name = "ai-dev-tools"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "django>=6.1.2",
    "psycopg[binary]>=3.3.6",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
